name: Test Go
on:
  - push
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reportd
          POSTGRES_PASSWORD: reportd
          POSTGRES_DB: reportd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reportd -d reportd_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://reportd:reportd@localhost:5432/reportd_test?sslmode=disable
      # Below go-template's 80: cmd/migrate and the BigQuery helpers need live
      # infrastructure to exercise. Actual is 63.3%; the slack absorbs the few
      # points the total shifts between Go versions. Raise as coverage climbs.
      COVERAGE_THRESHOLD: "60"
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install dependencies
        run: go get .
      - name: Build
        run: go build -v ./...
      - name: Test with coverage
        run: go test -v -race -coverprofile=coverage.out ./...
      - name: Enforce coverage threshold
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "Total coverage: ${total}% (threshold: ${COVERAGE_THRESHOLD}%)"
          awk -v c="$total" -v t="$COVERAGE_THRESHOLD" \
            'BEGIN { if (c+0 < t+0) { exit 1 } }' || {
              echo "::error::coverage ${total}% is below threshold ${COVERAGE_THRESHOLD}%"
              exit 1
            }
